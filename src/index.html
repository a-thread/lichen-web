<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lichen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="images/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="images/icons/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#8FA15A" />
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    //
    // Restores the real path encoded by public/404.html (see that file for
    // why) via history.replaceState, before the Angular router bootstraps
    // and reads the URL. Runs inline and un-deferred so it executes before
    // the bundled app scripts.
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
