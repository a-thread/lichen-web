<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.width]="size()"
  [attr.height]="size()"
>
  @switch (name()) {
    @case ('search') {
      <circle cx="11" cy="11" r="7" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    }
    @case ('grid') {
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
    }
    @case ('list') {
      <line x1="4" y1="6" x2="20" y2="6" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <line x1="4" y1="18" x2="20" y2="18" />
    }
    @case ('more') {
      <circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none" />
    }
    @case ('add') {
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    }
    @case ('delete') {
      <line x1="4" y1="7" x2="20" y2="7" />
      <path d="M9 7V4h6v3" />
      <rect x="6" y="7" width="12" height="13" rx="1.5" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    }
    @case ('check') {
      <polyline points="4 12 9 17 20 6" />
    }
    @case ('upload') {
      <polyline points="7 10 12 5 17 10" />
      <line x1="12" y1="5" x2="12" y2="15" />
      <path d="M5 19h14" />
    }
    @case ('download') {
      <polyline points="7 11 12 16 17 11" />
      <line x1="12" y1="16" x2="12" y2="4" />
      <path d="M5 20h14" />
    }
    @case ('sort') {
      <line x1="7" y1="4" x2="7" y2="20" />
      <polyline points="4 7 7 4 10 7" />
      <line x1="17" y1="4" x2="17" y2="20" />
      <polyline points="14 17 17 20 20 17" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <line x1="12" y1="11" x2="12" y2="16" />
      <circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none" />
    }
    @case ('sun') {
      <circle cx="12" cy="12" r="4" />
      <line x1="12" y1="2" x2="12" y2="4.5" />
      <line x1="12" y1="19.5" x2="12" y2="22" />
      <line x1="2" y1="12" x2="4.5" y2="12" />
      <line x1="19.5" y1="12" x2="22" y2="12" />
      <line x1="4.9" y1="4.9" x2="6.6" y2="6.6" />
      <line x1="17.4" y1="17.4" x2="19.1" y2="19.1" />
      <line x1="4.9" y1="19.1" x2="6.6" y2="17.4" />
      <line x1="17.4" y1="6.6" x2="19.1" y2="4.9" />
    }
    @case ('moon') {
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5Z" />
    }
    @case ('desktop') {
      <rect x="3" y="4" width="18" height="12" rx="1.5" />
      <line x1="8" y1="20" x2="16" y2="20" />
      <line x1="12" y1="16" x2="12" y2="20" />
    }
    @case ('logout') {
      <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" />
      <polyline points="14 15 19 12 14 9" />
      <line x1="19" y1="12" x2="9" y2="12" />
    }
    @case ('back') {
      <line x1="20" y1="12" x2="9" y2="12" />
      <polyline points="15 6 9 12 15 18" />
    }
    @case ('close') {
      <line x1="6" y1="6" x2="18" y2="18" />
      <line x1="18" y1="6" x2="6" y2="18" />
    }
    @case ('edit') {
      <path
        d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.7-1.7a2 2 0 0 0-2.8 0L4 15z"
      />
      <line x1="13.5" y1="6.5" x2="17.5" y2="10.5" />
    }
  }
</svg>
