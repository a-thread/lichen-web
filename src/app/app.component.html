<a class="skip-link" href="#main-content">Skip to main content</a>
@if (auth.userId()) {
  <header>
    <span class="brand">lichen</span>
    <div class="header-actions">
      <span class="status" role="status">{{ notesStore.isOnline() ? 'Online' : 'Offline — changes saved locally' }}</span>
      <button
        type="button"
        class="icon-btn"
        (click)="theme.cycle()"
        [attr.aria-label]="'Theme: ' + theme.preference() + ' (click to change)'"
        [title]="'Theme: ' + theme.preference() + ' (click to change)'"
      >
        @switch (theme.preference()) {
          @case ('system') { <app-icon name="desktop" /> }
          @case ('light') { <app-icon name="sun" /> }
          @case ('dark') { <app-icon name="moon" /> }
        }
      </button>
      <button type="button" class="secondary" (click)="signOut()">Sign out</button>
    </div>
  </header>
}
<main id="main-content">
  <router-outlet />
</main>
<app-toast />
