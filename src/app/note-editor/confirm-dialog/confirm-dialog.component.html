@if (open()) {
  <div class="scrim" (click)="cancelled.emit()">
    <div
      class="dialog"
      (click)="$event.stopPropagation()"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      (keydown.escape)="cancelled.emit()"
      (keydown.tab)="onTab($event)"
    >
      <h2 id="confirm-dialog-title">{{ title() }}</h2>
      <p id="confirm-dialog-message">{{ message() }}</p>
      <div class="actions">
        <button #cancelButton type="button" class="secondary" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
        <button #confirmButton type="button" class="danger" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
      </div>
    </div>
  </div>
}
