<div class="editor-page">
  <div class="editor">
    <div class="top-bar">
      @if (screenMode() === 'edit') {
        <button type="button" class="icon-btn" (click)="requestClose()" aria-label="Close" title="Close">
          <app-icon name="close" />
        </button>
      } @else {
        <button type="button" class="icon-btn" (click)="requestClose()" aria-label="Back" title="Back">
          <app-icon name="back" />
        </button>
      }

      <div class="top-bar-actions">
        @if (screenMode() === 'read') {
          <button type="button" class="secondary" (click)="exportNote()">
            <app-icon name="download" [size]="16" /><span>Export</span>
          </button>
          <button type="button" class="accent" (click)="enterEdit()">
            <app-icon name="edit" [size]="16" /><span>Edit</span>
          </button>
        } @else {
          <button type="button" class="accent" (click)="save()">
            <app-icon name="check" [size]="16" /><span>Save</span>
          </button>
        }
      </div>
    </div>

    @if (screenMode() === 'read') {
      <h1 class="read-title">{{ title() || 'Untitled' }}</h1>
      <app-note-preview [body]="text()" (toggleChecklist)="toggleChecklistReadOnly($event)" />
    } @else {
      <h1 class="visually-hidden">{{ existingNote() ? 'Edit note' : 'New note' }}</h1>
      <input
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        placeholder="Title"
        class="title-input"
        aria-label="Note title"
      />

      <div class="toolbar-row">
        <div class="mode-switch" role="group" aria-label="View mode">
          <button
            type="button"
            [class.active]="mode() === 'write'"
            [attr.aria-pressed]="mode() === 'write'"
            (click)="mode.set('write')"
          >Write</button>
          <button
            type="button"
            [class.active]="mode() === 'preview'"
            [attr.aria-pressed]="mode() === 'preview'"
            (click)="mode.set('preview')"
          >Preview</button>
        </div>
      </div>

      @if (mode() === 'write') {
        <app-formatting-toolbar [selection]="currentSelection()" (applyChange)="applyToolbarResult($event)" />
        <textarea #bodyInput [ngModel]="text()" (ngModelChange)="onBodyChange($event)"
                  (keyup)="onCaretMoved()" (click)="onCaretMoved()"
                  placeholder="Start writing..." rows="16" aria-label="Note body"></textarea>
      } @else {
        <app-note-preview [body]="text()" (toggleChecklist)="onToggleChecklist($event)" />
      }

      @if (existingNote()) {
        <div class="actions">
          <button (click)="remove()" class="danger">
            <app-icon name="delete" [size]="16" /><span>Delete</span>
          </button>
        </div>
      }
    }
  </div>
</div>

<app-confirm-dialog
  [open]="showDiscardDialog()"
  title="Discard changes?"
  message="Your changes will be lost."
  confirmLabel="Discard"
  cancelLabel="Cancel"
  (confirmed)="confirmDiscard()"
  (cancelled)="cancelDiscard()"
/>
