<div class="toolbar">
  <select [ngModel]="formatting().textStyle" (ngModelChange)="onStyleChange($event)" title="Text style">
    <option value="NORMAL">Normal</option>
    <option value="H1">Heading 1</option>
    <option value="H2">Heading 2</option>
    <option value="H3">Heading 3</option>
  </select>

  <span class="divider"></span>

  <button type="button" class="icon" [class.active]="formatting().bold" (click)="apply(toggleInline(selection(), '**'))" title="Bold"><b>B</b></button>
  <button type="button" class="icon" [class.active]="formatting().italic" (click)="apply(toggleInline(selection(), '*'))" title="Italic"><i>I</i></button>

  <span class="divider"></span>

  <button type="button" class="icon" [class.active]="formatting().bullet" (click)="apply(toggleBlock(selection(), 'bullet'))" title="Bullet list">&bull;</button>
  <button type="button" class="icon" [class.active]="formatting().checklist" (click)="apply(toggleBlock(selection(), 'checklist'))" title="Checklist">&#9745;</button>
  <button type="button" class="icon" [class.active]="formatting().numbered" (click)="apply(toggleBlock(selection(), 'numbered'))" title="Numbered list">1.</button>

  <span class="divider"></span>

  <button type="button" class="icon" [class.active]="formatting().code" (click)="apply(toggleInline(selection(), '`'))" title="Code"><code>&lt;/&gt;</code></button>
</div>
