name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Inject Supabase env
        run: |
          sed -i "s#YOUR_SUPABASE_URL#${{ secrets.SUPABASE_URL }}#" src/environments/environment.ts
          sed -i "s#YOUR_SUPABASE_ANON_KEY#${{ secrets.SUPABASE_ANON_KEY }}#" src/environments/environment.ts

      - name: Build Project
        run: npm run build -- --base-href=/lichen-web/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/lichen-web/browser
